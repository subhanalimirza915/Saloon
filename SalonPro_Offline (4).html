<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SalonPro</title>
<link id="favicon" rel="icon" href="data:,">
<style>
:root{--p:#8b5cf6;--s:#ec4899;--bg:#f4f1fb;--card:#fff;--txt:#17121f;--muted:#706878;--line:#e7e0ee}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--txt);background:var(--bg)}
body.ur{font-family:'Noto Naskh Arabic','Segoe UI',Tahoma,Arial,sans-serif;line-height:1.7}
body.dark{--bg:#0d1117;--card:#171b22;--txt:#f5f7fb;--muted:#aeb6c2;--line:#2b3340}
.top{height:72px;background:var(--card);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 20px;position:sticky;top:0;z-index:20}
.brand{display:flex;gap:10px;align-items:center;font-weight:800}
.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--p),var(--s));overflow:hidden;flex:none}
.logo.img{background:none}
.logo img{width:100%;height:100%;object-fit:cover}
.clock{font-size:13px;font-weight:700;text-align:end}
.side{position:fixed;top:72px;bottom:0;inset-inline-start:0;width:245px;background:var(--card);border-inline-end:1px solid var(--line);padding:14px;z-index:10;overflow:auto}
.main{margin-inline-start:245px;padding:26px;max-width:1280px}
.nav{width:100%;border:0;background:transparent;color:var(--muted);text-align:start;padding:12px;border-radius:12px;margin:3px 0;cursor:pointer;font-size:14px;font-family:inherit}
.nav:hover,.nav.active{background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--p);font-weight:700}
.ni{display:inline-block;min-width:1.7em}
.bdg{background:#ef4444;color:#fff;border-radius:99px;font-size:11px;padding:2px 7px;margin-inline-start:6px;font-weight:800}
.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 15px 40px #32195b13}
.banner{position:relative;overflow:hidden;padding:28px;border-radius:23px;color:#fff;background:linear-gradient(135deg,#15111e,var(--p),var(--s));min-height:150px}
.banner .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner .ov{position:absolute;inset:0;background:linear-gradient(135deg,#15111eb0,#15111e55,#15111e33)}
.banner .in{position:relative}
.banner h1{margin:0 0 6px}
.bigclock{font-size:34px;font-weight:800;margin-top:8px}
.muted{color:var(--muted);font-size:13px}
.title{display:flex;justify-content:space-between;align-items:center;margin:24px 0 13px;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:10px 14px;background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p);font-weight:700;cursor:pointer;font-family:inherit;font-size:14px}
.btn.primary{background:linear-gradient(135deg,var(--p),var(--s));color:#fff}
.btn.red{background:#fee2e2;color:#b91c1c}
.btn.green{background:#dcfce7;color:#15803d}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--txt);font-family:inherit;font-size:14px}
.field input[type=color]{padding:3px;height:44px;cursor:pointer}
.form{display:grid;gap:12px}
.service{min-height:185px;display:flex;flex-direction:column;justify-content:space-between}
.price{font-weight:800;color:var(--p)}
.old{text-decoration:line-through;color:var(--muted);font-size:12px;font-weight:600}
.pill,.badge{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800}
.pill{background:color-mix(in srgb,var(--p) 14%,transparent);color:var(--p)}
.pill.hot{background:#fee2e2;color:#b91c1c}
.pending{background:#fef3c7;color:#92400e}.accepted{background:#dbeafe;color:#1d4ed8}.ready{background:#dcfce7;color:#15803d}.done{background:#e5e7eb;color:#374151}.rejected{background:#fee2e2;color:#b91c1c}
.new{background:#fef3c7;color:#92400e}.seen{background:#e5e7eb;color:#374151}
.order{padding:17px 0;border-bottom:1px solid var(--line)}
.og{display:grid;grid-template-columns:1.5fr 1.2fr 1fr auto;gap:12px;align-items:center}
.cd{color:var(--s)}
.timebox{background:color-mix(in srgb,var(--p) 12%,transparent);color:var(--txt);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.notif{padding:14px;border-radius:14px;border:1px solid var(--line);margin-bottom:10px}
.notif.isnew{background:color-mix(in srgb,var(--p) 12%,transparent);border-color:color-mix(in srgb,var(--p) 40%,transparent)}
.stat h2{margin:0 0 4px}
.pos{color:#15803d}.neg{color:#b91c1c}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 10% 10%,color-mix(in srgb,var(--s) 30%,transparent),transparent 30%),radial-gradient(circle at 90% 10%,color-mix(in srgb,var(--p) 30%,transparent),transparent 30%),var(--bg)}
.authbox{width:min(450px,100%)}
.center{text-align:center}
.modalbg{position:fixed;inset:0;background:#08050dbb;display:grid;place-items:center;padding:18px;z-index:100}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto}
.close{float:inline-end;background:0;border:0;font-size:25px;color:var(--muted);cursor:pointer}
.toast{position:fixed;inset-inline-end:18px;bottom:18px;background:#17121f;color:#fff;padding:13px 16px;border-radius:13px;z-index:200;max-width:340px}
.mobile{display:none}
.preview{max-width:100%;max-height:160px;border-radius:12px;margin-top:10px}
.stars span{font-size:28px;cursor:pointer;color:#cbd5e1}
.stars span.on{color:#f59e0b}
.star-s{color:#f59e0b;letter-spacing:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:46px;height:34px;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.langrow{display:flex;gap:8px;justify-content:center;margin-top:6px}
#dueAlert{position:fixed;top:14px;inset-inline:14px;margin:auto;max-width:560px;z-index:300;background:linear-gradient(135deg,var(--p),var(--s));color:#fff;padding:16px 18px;border-radius:18px;box-shadow:0 20px 50px #0006}
#dueAlert .x{float:inline-end;background:#ffffff40;border:0;color:#fff;border-radius:8px;cursor:pointer;padding:2px 9px;font-size:16px}
@media(max-width:850px){.side{inset-inline-start:-255px;transition:.2s}.side.open{inset-inline-start:0}.main{margin-inline-start:0}.mobile{display:block}.og{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.two,.three{grid-template-columns:1fr}.clock{font-size:11px;max-width:150px}}
</style>
</head>

function loadDB(){
  var db=null;
  try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!db||typeof db!=='object')db={};
  ['users','orders','notifs','expenses','deals','feedback'].forEach(function(k){if(!Array.isArray(db[k]))db[k]=[]});
  if(!db.adminPass)db.adminPass=DEFAULT_ADMIN_PASSWORD;
  if(!db.shopName)db.shopName='SalonPro';
  if(!db.adminHeading)db.adminHeading='Welcome Owner';
  if(!db.tagline)db.tagline=DEFAULT_TAGLINE;
  if(!db.colorP)db.colorP=DEF_P;
  if(!db.colorS)db.colorS=DEF_S;
  if(!db.icons||typeof db.icons!=='object')db.icons={};
  if(!db.contact||typeof db.contact!=='object')db.contact={name:'',phone:'',email:'',addr:''};
  if(!db.services||!db.services.length){
    db.services=[
      {id:'s1',name:'Faisal Hair Cut',price:500,duration:30,desc:'Modern haircut & styling'},
      {id:'s2',name:'Hair Styling',price:800,duration:45,desc:'Professional hair styling'},
      {id:'s3',name:'Beard Trim',price:300,duration:20,desc:'Clean beard shaping'},
      {id:'s4',name:'Hair Wash',price:250,duration:15,desc:'Fresh hair wash'},
      {id:'s5',name:'Face Cleanup',price:600,duration:30,desc:'Basic facial cleanup'},
      {id:'s6',name:'Hair Color',price:1500,duration:90,desc:'Professional hair coloring'}
    ];
  }
  localStorage.setItem(KEY,JSON.stringify(db));
  return db;
}
var DB=loadDB();
function save(){localStorage.setItem(KEY,JSON.stringify(DB))}
/* always work on the latest data (important when 2 tabs are open) */
function upd(fn){DB=loadDB();fn();save()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function byId(arr,id){return arr.filter(function(x){return x.id===id})[0]}
/* notifications are stored as type + params, so the customer sees them in his own language */
function pushNotif(userId,type,p,orderId){DB.notifs.push({id:uid(),userId:userId,type:type,p:p||{},time:Date.now(),read:false,orderId:orderId||''})}

/* login is kept per TAB (sessionStorage) so each tab has its own login */
function getSession(){try{return JSON.parse(sessionStorage.getItem(SKEY))}catch(e){return null}}
function setSession(s){if(s)sessionStorage.setItem(SKEY,JSON.stringify(s));else sessionStorage.removeItem(SKEY)}

function lang(){return localStorage.salonLang==='ur'?'ur':'en'}
/* admin panel is always English / Roman Urdu; only customer screens use the chosen language */
function uiLang(){var s=getSession();return (s&&s.role==='admin')?'en':lang()}
function t(k,p){
  var l=uiLang(),s=T[l][k];
  if(s==null)s=T.en[k];
  if(s==null)return k;
  if(p)Object.keys(p).forEach(function(x){s=s.split('{'+x+'}').join(p[x])});
  return s;
}
function loc(){return uiLang()==='ur'?'ur-PK':'en-PK'}
function setDir(d){document.documentElement.dir=d;document.documentElement.lang=d==='rtl'?'ur':'en';document.body.classList.toggle('ur',d==='rtl')}
var authScreen='login';
function setLang(l){
  localStorage.salonLang=l;
  if(getSession())render();
  else if(authScreen==='reg')regScreen();else loginScreen();
}
function nText(n){
  if(!n.type)return n.text||'';
  var p=n.p||{};
  return t('n_'+n.type,{service:p.service||'',time:p.time?appt(p.time):'',msg:p.msg?' — '+p.msg:'',text:p.text||'',kind:p.kind?t('fb_'+p.kind):''});
}

/* ================= ICONS / COLORS / LOGO ================= */
function icon(k){
  if(Object.prototype.hasOwnProperty.call(DB.icons,k)){
    var v=DB.icons[k];
    if(k==='logo'&&!v)return '✂';
    return v;
  }
  for(var i=0;i<ICON_DEF.length;i++)if(ICON_DEF[i][0]===k)return ICON_DEF[i][2];
  return '';
}
function applyColors(){
  var r=document.documentElement.style;
  r.setProperty('--p',DB.colorP||DEF_P);
  r.setProperty('--s',DB.colorS||DEF_S);
}
var logoURL='';
function logoInner(){return logoURL?"<img src='"+logoURL+"' alt=''>":esc(icon('logo'))}
function logoHTML(style){return "<div class='logo"+(logoURL?" img":"")+"'"+(style?" style=\""+style+"\"":"")+">"+logoInner()+"</div>"}
function paintLogos(){
  var els=document.querySelectorAll('.logo');
  for(var i=0;i<els.length;i++){els[i].classList.toggle('img',!!logoURL);els[i].innerHTML=logoInner()}
  setFavicon();
}
function setFavicon(){
  var l=document.getElementById('favicon');if(!l)return;
  if(logoURL){l.href=logoURL;return}
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='"+(DB.colorP||DEF_P)+"'/><text x='50' y='68' font-size='56' text-anchor='middle' fill='white'>"+esc(icon('logo'))+"</text></svg>";
  l.href='data:image/svg+xml,'+encodeURIComponent(svg);
}

/* ================= MEDIA (banner + logo images in IndexedDB) ================= */
var bannerURL='',bannerType='';
function idb(){return new Promise(function(res,rej){var r=indexedDB.open('salonpro_media',1);r.onupgradeneeded=function(){r.result.createObjectStore('m')};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbPut(k,v){return idb().then(function(d){return new Promise(function(res,rej){var t2=d.transaction('m','readwrite');t2.objectStore('m').put(v,k);t2.oncomplete=res;t2.onerror=function(){rej(t2.error)}})})}
function idbGet(k){return idb().then(function(d){return new Promise(function(res,rej){var q=d.transaction('m').objectStore('m').get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbDel(k){return idb().then(function(d){return new Promise(function(res,rej){var t2=d.transaction('m','readwrite');t2.objectStore('m').delete(k);t2.oncomplete=res;t2.onerror=function(){rej(t2.error)}})})}
function loadBanner(){
  idbGet('banner').then(function(blob){
    if(bannerURL){URL.revokeObjectURL(bannerURL);bannerURL=''}
    if(blob){bannerURL=URL.createObjectURL(blob);bannerType=(blob.type||'').indexOf('video')===0?'video':'image'}
    if(getSession())render();
  }).catch(function(){});
}
function loadLogo(){
  idbGet('logo').then(function(blob){
    if(logoURL){URL.revokeObjectURL(logoURL);logoURL=''}
    if(blob)logoURL=URL.createObjectURL(blob);
    paintLogos();
  }).catch(function(){});
}
function setBanner(inp){
  var f=inp.files[0];if(!f)return;
  if(f.size>200*1024*1024){toast('File bohat bari hai (200MB se kam rakhein).');return}
  idbPut('banner',f).then(function(){
    upd(function(){DB.bannerVersion=Date.now()});
    toast('Banner lag gaya.');loadBanner();
  }).catch(function(){toast('Banner save nahi ho saka.')});
}
function delBanner(){
  idbDel('banner').then(function(){upd(function(){DB.bannerVersion=Date.now()});toast('Banner hata diya.');loadBanner()}).catch(function(){});
}
function setLogo(inp){
  var f=inp.files[0];if(!f)return;
  if(f.type.indexOf('image')!==0){toast('Sirf image file chunein.');return}
  if(f.size>5*1024*1024){toast('Image 5MB se choti rakhein.');return}
  idbPut('logo',f).then(function(){
    upd(function(){DB.logoVersion=Date.now()});
    toast('Logo / web icon lag gaya.');loadLogo();render();
  }).catch(function(){toast('Logo save nahi ho saka.')});
}
function delLogo(){
  idbDel('logo').then(function(){upd(function(){DB.logoVersion=Date.now()});toast('Logo hata diya.');loadLogo();render()}).catch(function(){});
}

/* ================= HELPERS ================= */
var page='home', prompted={}, dueSent={}, dueDismissed={}, fbRating=5, pendingRender=false;
function $(x){return document.getElementById(x)}
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}
function money(n){return 'Rs. '+Number(n||0).toLocaleString()}
function pad(n){return n<10?'0'+n:''+n}
function dkey(v){var d=new Date(v);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function when(v){var d=new Date(v);return isNaN(d)?'—':d.toLocaleString(loc(),{dateStyle:'medium',timeStyle:'short'})}
function appt(v){var d=new Date(v);return isNaN(d)?'—':d.toLocaleString(loc(),{weekday:'long',day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function toast(x){var e=document.createElement('div');e.className='toast';e.textContent=x;document.documentElement.appendChild(e);setTimeout(function(){e.remove()},3500)}
function theme(){document.body.classList.toggle('dark',localStorage.salonTheme==='dark');applyColors()}
function setTheme(x){localStorage.salonTheme=x;theme();render()}

function fmtLeft(ms){
  if(ms<=0)return null;
  var s=Math.floor(ms/1000),d=Math.floor(s/86400);s%=86400;
  var h=Math.floor(s/3600);s%=3600;var m=Math.floor(s/60);s%=60;
  var p=[];if(d)p.push(d+' '+t('days'));if(d||h)p.push(h+' '+t('hours'));p.push(m+' '+t('mins'));p.push(s+' '+t('secs'));
  return p.join(' ');
}
function cd(end,mode){return "<b class=cd data-end='"+end+"' data-mode='"+mode+"'></b>"}

/* shop time reached -> alert for 2 minutes (customer side) */
function dismissDue(id){dueDismissed[id]=1;var e=$('dueAlert');if(e)e.remove()}
function dueCheck(){
  var s=getSession(),el=$('dueAlert'),o=null,now=Date.now();
  if(s&&s.role==='user'){
    o=DB.orders.filter(function(x){
      if(x.userId!==s.id||dueDismissed[x.id]||!x.confirmedTime||(x.status!=='accepted'&&x.status!=='ready'))return false;
      var ct=new Date(x.confirmedTime).getTime();
      return now>=ct&&now<ct+120000;
    })[0];
  }
  if(!o){if(el)el.remove();return}
  var key=o.id+lang();
  if(!el||el.getAttribute('data-key')!==key){
    if(!el){el=document.createElement('div');el.id='dueAlert';document.documentElement.appendChild(el)}
    el.setAttribute('data-key',key);
    el.innerHTML="<button class=x onclick=\"dismissDue('"+o.id+"')\">✕</button><div style='font-size:18px;font-weight:800'>⏰ "+esc(t('due_title'))+"</div><div style='margin-top:6px'><b>"+esc(o.service)+"</b> — "+esc(appt(o.confirmedTime))+"</div>";
  }
  if(!dueSent[o.id]){
    dueSent[o.id]=1;
    var oid=o.id;
    upd(function(){var q=byId(DB.orders,oid);if(q&&!q.dueNotified){q.dueNotified=true;pushNotif(q.userId,'due',{service:q.service},q.id)}});
    render();
  }
}
function tick(){
  var now=new Date();
  var c=$('clock');
  if(c)c.textContent=now.toLocaleTimeString('en-PK')+' • '+now.toLocaleDateString('en-PK',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  var b=$('bigclock');if(b)b.textContent=now.toLocaleTimeString('en-PK');
  var bd=$('bigdate');if(bd)bd.textContent=now.toLocaleDateString('en-PK',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  var els=document.querySelectorAll('.cd');
  for(var i=0;i<els.length;i++){
    var el=els[i],l=fmtLeft(+el.getAttribute('data-end')-Date.now());
    el.textContent=l?l:(el.getAttribute('data-mode')==='deal'?t('cd_deal_over'):t('cd_due'));
  }
  dueCheck();
}
setInterval(tick,1000);

function doReg(){
  var em=$('email').value.trim().toLowerCase(),nm=$('name').value.trim(),ph=$('phone').value.trim(),pw=$('pass').value;
  var id=uid(),dup=false;
  upd(function(){
    if(DB.users.some(function(u){return u.email===em})){dup=true;return}
    DB.users.push({id:id,name:nm,email:em,phone:ph,pass:pw,createdAt:Date.now()});
  });
  if(dup){toast(t('err_dup'));return}
  setSession({role:'user',id:id});page='home';render();toast(t('acc_created'));

function doLogin(){
  DB=loadDB();
  var em=$('email').value.trim().toLowerCase(),pw=$('pass').value;
  var u=DB.users.filter(function(x){return x.email===em&&x.pass===pw})[0];
  if(!u){toast(t('err_login'));return}
  setSession({role:'user',id:u.id});page='home';render();
}
function doAdmin(){
  DB=loadDB();
  if($('pass').value.trim()!==DB.adminPass){toast('Wrong admin password.');return}
  setSession({role:'admin'});page='dashboard';render();
}

var ADMIN_LABELS={dashboard:'Dashboard',adminOrders:'Orders',adminCustomers:'Customers',adminFinance:'Finance',adminServices:'Services',adminDeals:'Deals',adminReviews:'Reviews',adminSettings:'Settings'};
function shell(admin,u){
  var nav;
  if(admin){
    var np=DB.orders.filter(function(o){return o.status==='pending'}).length;
    var nf=DB.feedback.filter(function(f){return f.status==='new'}).length;

/* ================= RENDER ================= */
function render(){
  theme();
  var s=getSession();
  if(!s){if(authScreen==='reg')regScreen();else if(authScreen==='admin')adminScreen();else loginScreen();return}
  if(document.querySelector('.modalbg'))return;
  document.title=DB.shopName;
  setFavicon();
  if(s.role==='admin'){
    setDir('ltr');
    if(['dashboard','adminOrders','adminCustomers','adminFinance','adminServices','adminDeals','adminReviews','adminSettings'].indexOf(page)<0)page='dashboard';
    shell(true);adminPage();
  }else{
    var u=byId(DB.users,s.id);
    if(!u){setSession(null);loginScreen();return}
    setDir(lang()==='ur'?'rtl':'ltr');
    if(['home','services','orders','notifs','profile','settings'].indexOf(page)<0)page='home';
    shell(false,u);userPage(u);
  }
  var vids=document.querySelectorAll('video');
  for(var i=0;i<vids.length;i++){vids[i].muted=true;var pr=vids[i].play();if(pr&&pr.catch)pr.catch(function(){})}
  tick();
  if(s.role==='admin')checkNew();
}

function feedbackHTML(u){

  return "<div class=title><h2>💬 "+esc(t('fb_title'))+"</h2></div><div class=card><p class=muted style='margin-top:0'>"+esc(t('fb_sub'))+"</p>"+
  "<form class=form onsubmit='event.preventDefault();sendFeedback()'>"+
  "<div class=field><label>"+esc(t('fb_type'))+"</label><select id=fk onchange='toggleStars()'><option value='review'>"+esc(t('fb_review'))+"</option><option value='complaint'>"+esc(t('fb_complaint'))+"</option></select></div>"+

/* ---- Finance ---- */
function buildDays(){
  var m={};
  function g(k){return m[k]||(m[k]={day:k,orders:0,done:0,income:0,exp:0})}
  g(dkey(Date.now()));
  DB.orders.forEach(function(o){
    g(dkey(o.createdAt)).orders++;
    if(o.status==='done'){var r=g(dkey(o.doneAt||o.createdAt));r.done++;r.income+=(+o.price||0)}
  });
  DB.expenses.forEach(function(e){g(e.date).exp+=(+e.amount||0)});
  return Object.keys(m).sort().reverse().map(function(k){return m[k]});
}
function sumDays(arr){return arr.reduce(function(a,d){a.orders+=d.orders;a.done+=d.done;a.income+=d.income;a.exp+=d.exp;return a},{orders:0,done:0,income:0,exp:0})}

  "<div class=muted style='margin-top:8px'>Kharcha / Bills</div><b>"+money(s.exp)+"</b>"+
  "<div class=muted style='margin-top:8px'>Profit</div><b class='"+(p>=0?'pos':'neg')+"' style='font-size:20px'>"+money(p)+"</b></div>";

  days.map(function(d){var p=d.income-d.exp;return "<tr><td><b>"+d.day+"</b></td><td>"+d.orders+"</td><td>"+d.done+"</td><td>"+money(d.income)+"</td><td>"+money(d.exp)+"</td><td class='"+(p>=0?'pos':'neg')+"'><b>"+money(p)+"</b></td></tr>"}).join('')+"</table></div></div>"+
  "<div class=title><h2>Pichle kharche (aakhri 20)</h2></div><div class=card>"+(recent.length?"<div class=tblwrap><table class=tbl><tr><th>Date</th><th>Cheez</th><th>Category</th><th>Amount</th></tr>"+recent.map(function(e){return "<tr><td>"+e.date+"</td><td>"+esc(e.title)+"</td><td>"+esc(e.cat)+"</td><td>"+money(e.amount)+"</td></tr>"}).join('')+"</table></div>":"Koi kharcha nahi.")+"</div>";
}
function addExp(){
  var tt=$('et').value.trim(),cat=$('ec').value,a=+$('ea').value,d=$('ed').value;
  if(!tt||!(a>0)||!d){toast('Poori details likhein.');return}
  upd(function(){DB.expenses.push({id:uid(),title:tt,cat:cat,amount:a,date:d,createdAt:Date.now()})});
  toast('Kharcha add ho gaya.');render();
}
function delE(id){if(confirm('Ye kharcha delete karein?')){upd(function(){DB.expenses=DB.expenses.filter(function(e){return e.id!==id})});render()}}

/* ---- Orders: confirm popup ---- */
function checkNew(){
  if(document.querySelector('.modalbg'))return;
  var o=DB.orders.filter(function(x){return x.status==='pending'&&!prompted[x.id]})[0];
  if(o){prompted[o.id]=1;confirmModal(o.id)}
}
function confirmModal(id){
  DB=loadDB();
  var o=byId(DB.orders,id);if(!o)return;
  var isNew=o.status==='pending';
  modal("<h2>"+(isNew?'🔔 Naya Order Aya Hai':'🕒 Waqt Tabdeel Karein')+"</h2>"+
  "<p><b>"+esc(o.userName)+"</b> ne <b>"+when(o.createdAt)+"</b> par order kiya hai.</p>"+
  "<div class=timebox style='margin-bottom:12px'>✂ <b>"+esc(o.service)+"</b> — "+money(o.price)+"<br>📞 "+esc(o.phone)+"<br>✉️ "+esc(o.email)+"<br>📅 Customer ka manga hua waqt:<br><b>"+appt(o.appointment)+"</b>"+(o.note?"<br>📝 "+esc(o.note):"")+"</div>"+
  "<p>"+(isNew?'<b>Kya aap is order ko confirm karte hain?</b>':'<b>Naya waqt chunein:</b>')+"</p>"+
  "<form class=form onsubmit=\"event.preventDefault();doConfirm('"+id+"')\">"+
  "<div class=field><label>Customer shop par kis waqt aaye?</label><input id=ct type=datetime-local value='"+esc(o.confirmedTime||o.appointment)+"' required></div>"+
  "<div class=field><label>Customer ke liye message (optional)</label><input id=cm></div>"+
  "<button class='btn primary'>✔ Confirm</button>"+
  (isNew?"<button type=button class='btn red' onclick=\"doReject('"+id+"')\">✖ Reject</button>":"")+
  "<button type=button class=btn onclick='closeM()'>"+(isNew?'Baad mein':'Cancel')+"</button></form>");
}
function doConfirm(id){
  var tt=$('ct').value,mx=$('cm').value.trim();
  if(!tt){toast('Waqt likhein.');return}
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    var changed=!!o.confirmedTime;
    if(o.status==='pending')o.status='accepted';
    o.confirmedTime=tt;o.confirmedAt=Date.now();
    o.dueNotified=false;
    pushNotif(o.userId,changed?'retime':'confirm',{service:o.service,time:tt,msg:mx},o.id);
  });
  toast('Order confirm — customer ko notification chali gayi.');
  closeM();
}
function doReject(id){
  if(!confirm('Is order ko reject karein?'))return;
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    o.status='rejected';
    pushNotif(o.userId,'rejected',{service:o.service},o.id);
  });
  toast('Order reject kar diya.');
  closeM();
}
function stat(id,s){
  DB=loadDB();
  var o0=byId(DB.orders,id);
  if(s==='accepted'&&!o0.confirmedTime){confirmModal(id);return}
  upd(function(){
    var o=byId(DB.orders,id);if(!o)return;
    var was=o.status;o.status=s;
    if(s==='done'&&was!=='done')o.doneAt=Date.now();
    if(s!=='done')o.doneAt=null;
    if(s!==was){
      if(s==='ready'||s==='done'||s==='rejected'||s==='accepted')pushNotif(o.userId,s,{service:o.service},o.id);
    }
  });
  toast('Customer ko status mil gaya.');render();
}
function msg(id){
  DB=loadDB();
  var o=byId(DB.orders,id);
  modal("<h2>Customer Notification</h2><p class=muted>"+esc(o.userName)+" — "+esc(o.service)+"</p><form class=form onsubmit=\"event.preventDefault();sendMsg('"+id+"')\"><div class=field><label>Message</label><input id=mn value='"+esc(o.adminNote||'')+"' required></div><button class='btn primary'>Send</button></form>");
}
function sendMsg(id){
  var tt=$('mn').value.trim();if(!tt)return;
  upd(function(){var o=byId(DB.orders,id);if(!o)return;o.adminNote=tt;pushNotif(o.userId,'msg',{service:o.service,text:tt},o.id)});
  toast('Message bhej diya.');closeM();
}

    else{x.id=uid();DB.deals.push(x)}
  });
  toast('Deal save ho gayi.');closeM();

function delD(id){if(confirm('Deal delete karein?')){upd(function(){DB.deals=DB.deals.filter(function(d){return d.id!==id})});render()}}

function saveShop(){
  var a=$('shn').value.trim(),b=$('adh').value.trim(),c2=$('tgl').value.trim();
  upd(function(){DB.shopName=a||'SalonPro';DB.adminHeading=b||'Welcome Owner';DB.tagline=c2||DEFAULT_TAGLINE});
  toast('Save ho gaya.');render();
}
function cp(){
  DB=loadDB();
  if($('old').value!==DB.adminPass){toast('Current password ghalat hai.');return}
  var n=$('np').value;
  upd(function(){DB.adminPass=n});
  toast('Password changed');$('old').value='';$('np').value='';
}
function backup(){
  DB=loadDB();
  var blob=new Blob([JSON.stringify(DB,null,1)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='salon-backup-'+dkey(Date.now())+'.json';
  document.body.appendChild(a);a.click();a.remove();
}
function restore(inp){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.orders)||!Array.isArray(d.users))throw 0;
      if(!confirm('Mojooda data replace ho jayega. Jari rakhein?'))return;
      DB=d;save();DB=loadDB();toast('Restore ho gaya.');render();
    }catch(e){toast('Ghalat backup file.')}
  };
  r.readAsText(f);
}

/* ================= LIVE UPDATE FROM OTHER TABS ================= */
function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
window.addEventListener('storage',function(e){
  if(e.key!==KEY)return;
  var s=getSession(),before={},fbBefore=DB.feedback.length;
  DB.notifs.forEach(function(n){before[n.id]=1});
  var oldB=DB.bannerVersion,oldL=DB.logoVersion;
  DB=loadDB();
  theme();
  if(oldB!==DB.bannerVersion)loadBanner();
  if(oldL!==DB.logoVersion)loadLogo();
  if(s&&s.role==='user'){
    var fresh=DB.notifs.filter(function(n){return n.userId===s.id&&!before[n.id]});
    if(fresh.length)toast('🔔 '+nText(fresh[fresh.length-1]));
  }
  if(s&&s.role==='admin'&&DB.feedback.length>fbBefore)toast('⭐ Naya review / complaint aya hai');
  if(!s)return;
  /* do not wipe what someone is typing; refresh after he leaves the field */
  if(typing()){pendingRender=true;return}
  render();
});
document.addEventListener('focusout',function(){
  if(!pendingRender)return;
  setTimeout(function(){if(pendingRender&&!typing()){pendingRender=false;render()}},400);
});

/* ================= START ================= */
theme();
render();
loadBanner();
loadLogo();
